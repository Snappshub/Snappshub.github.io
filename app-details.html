<!DOCTYPE html>

  <title>SnappsHub - App Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
<style data-purpose="app-details-responsive">
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;min-width:320px;min-height:100%;overflow-x:clip}
body{padding:clamp(.75rem,3vw,2rem)!important}
body>div{width:min(100%,56rem);margin-inline:auto}
.glass-card{min-width:0;overflow-wrap:anywhere}
h1{font-size:clamp(1.35rem,4vw,2rem);line-height:1.2}
p{line-height:1.65}
@media(max-width:639px){body{padding:.85rem!important}.glass-card{padding:1rem!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="bg-[#070a12] text-slate-100 p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    <a href="index.html" class="text-cyber-cyan text-xs font-mono">← Back to Hub</a>
    <div class="glass-card p-6 rounded-2xl">
      <h1 class="text-2xl font-black text-white">CapCut Studio Pro</h1>
      <p class="text-xs text-slate-400 mt-1">Full VIP unlocked, 4K 60FPS export, SHA-256 clean signature verified.</p>
    </div>
  </div>
</body>
</html>
