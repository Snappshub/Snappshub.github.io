name: Website catalogue validation

on:
  push:
    branches: [live]
  pull_request:
    branches: [live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate catalogue and website entrypoint
        run: node scripts/validate-catalog.mjs
